[build]
  # Node.js version
  command = "npm run build"
  
[build.environment]
  # Set Node.js version to 20.19.0 or higher
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "10.8.2"
  # Canonical URL for sitemap, robots, and OG tags (do not use localhost here)
  NUXT_SITE_URL = "https://ukpubs.co.uk"
  NUXT_PUBLIC_APP_URL = "https://ukpubs.co.uk"
  NUXT_PUBLIC_API_URL = "https://ukpubs.co.uk"
  # Set your Mapbox public token in Netlify UI (Site settings → Environment variables)
  # NUXT_PUBLIC_MAPBOX_TOKEN = your Mapbox public token (pk.*)
  # DATABASE_URL = Supabase Transaction pooler :6543/postgres?pgbouncer=true&connection_limit=1 (NOT :5432)

# Headers for performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Preload the homepage LCP hero as early as possible (HTTP header, before HTML).
[[headers]]
  for = "/"
  [headers.values]
    Link = "</assets/images/hero-home-640.avif>; rel=preload; as=image; type=image/avif; fetchpriority=high; imagesrcset=\"/assets/images/hero-home-640.avif 640w, /assets/images/hero-home-960.avif 960w, /assets/images/hero-home-1280.avif 1280w, /assets/images/hero-home-1600.avif 1600w\"; imagesizes=\"100vw\""

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nuxt/Nitro serverless — allow time to build large sitemaps
[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 26
